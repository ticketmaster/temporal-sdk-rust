[package]
name = "temporalio-workflow"
version = "0.4.0"
edition = "2024"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = "LICENSE.txt"
description = "Temporal Rust workflow authoring surface"
homepage = "https://temporal.io/"
repository = "https://github.com/temporalio/sdk-core"
keywords = ["temporal", "workflow"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0"
bon = {version = "3", default-features = false, features = ["alloc", "implied-bounds"]}
derive_more = {version = "2.0", default-features = false, features = ["constructor", "display", "from", "into", "debug", "try_into"]}
futures-util = { version = "0.3", default-features = false, features = [
  "async-await-macro",
  "alloc",
  "std",
] }
futures-channel = { version = "0.3", default-features = false, features = [
  "alloc",
] }
prost = {version = "0.14"}
prost-types = {version = "0.7", package = "prost-wkt-types"}
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
wit-bindgen = { version = "0.57.1", default-features = false, features = ["macros", "std", "realloc", "bitflags"] }

[dependencies.temporalio-common-wasm]
path = "../common-wasm"
version = "0.4"

[dependencies.temporalio-macros]
path = "../macros"
version = "0.4"

